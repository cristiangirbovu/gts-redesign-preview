<div class="form-card" id="oferta">
  <h2>Request a quote</h2>
  <p class="sub">Attach your document and receive a price quote and delivery time within 2 hours.</p>
  <form action="https://formsubmit.co/gts_trad@yahoo.com" method="POST" enctype="multipart/form-data" target="_blank">
    <input type="hidden" name="_subject" value="Cerere Traduceri - Formular Website">
    <input type="hidden" name="_captcha" value="false">
    <input type="hidden" name="_template" value="table">
    <input type="hidden" name="_next" value="https://www.gtstraduceri.ro/en/thank-you/">
    <input type="text" name="_honey" style="display:none">
    <input type="hidden" name="_autoresponse" value="Thank you for your request! Our team will contact you as soon as possible.">

    <div class="two">
      <div class="field">
        <label for="h-name">Full name *</label>
        <input type="text" id="h-name" name="Nume_Complet" required autocomplete="name">
      </div>
      <div class="field">
        <label for="h-phone">Phone number</label>
        <input type="tel" id="h-phone" name="Telefon" autocomplete="tel">
      </div>
    </div>

    <div class="two">
      <div class="field">
        <label for="h-email">Email address *</label>
        <input type="email" id="h-email" name="email" required autocomplete="email">
      </div>
      <div class="field">
        <label for="h-serv">Service type *</label>
        <select id="h-serv" name="Tip_Serviciu" required>
          <option value="">Select service</option>
          <option value="Traduceri Autorizate">Authorized translations</option>
          <option value="Traduceri Legalizate">Legalized translations</option>
          <option value="Interpretariat">Interpretation</option>
          <option value="Colaționare">Collation</option>
          <option value="Apostilă/Supralegalizare Camera Notarilor Publici, Viză MAE / Ambasadă">Apostille / Superlegalization</option>
          <option value="Prelucrare DTP">DTP processing</option>
          <option value="Transcriere Audio-Video">Audio-video transcription</option>
          <option value="Subtitrare Video">Video subtitling</option>
        </select>
      </div>
    </div>

    <div class="field">
      <label for="h-msg">Details (optional)</label>
      <textarea id="h-msg" name="Mesaj" rows="2" placeholder="E.g. I need a legalized translation, I travel on 15 August, there are 3 documents..."></textarea>
    </div>

    <div class="field">
      <label>Attach document</label>
      <label class="file" for="h-doc">
        <b>Choose a file</b> or drag it here
        <small>PDF, DOC, DOCX, JPG, PNG, TXT (max 10MB)</small>
        <input type="file" id="h-doc" name="attachment" accept=".pdf,.doc,.docx,.jpg,.jpeg,.png,.txt">
      </label>
    </div>

    <label class="consent">
      <input type="checkbox" name="Acord_Confidentialitate" required>
      <span>I agree with the <a href="/en/privacy/" target="_blank">privacy policy</a> and personal data processing.</span>
    </label>

    <button type="submit" class="btn btn-primary btn-block">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg>
      Send request
    </button>
    <p class="form-note">We respond within 2 hours, during business hours.</p>
  </form>
</div>
